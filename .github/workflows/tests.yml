name: Testes de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Subir a API
        run: PORT=3001 npm start &
        env:
          PORT: 3001

      - name: Esperar a API ficar disponível
        run: npx wait-on http://localhost:3001

      - name: Executar testes
        run: npm test
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ALUNO_EMAIL: ${{ secrets.ALUNO_EMAIL }}
          ALUNO_PASSWORD: ${{ secrets.ALUNO_PASSWORD }}
          ALUNO_ID: ${{ secrets.ALUNO_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
          BASE_URL: ${{ secrets.BASE_URL }}
